version: 1.0.5
cache: true

endpoints:
  openAI:
    name: "LiteLLM"
    apiKey: "${LITELLM_MASTER_KEY}"
    baseURL: "http://litellm:4000/v1"
    models:
      default: ["claude-3-5-sonnet", "gpt-4o", "venice-fast"]
      fetch: true
    titleConvo: true
    titleModel: "claude-3-5-sonnet"
    summarize: false
    summaryModel: "claude-3-5-sonnet"
    forcePrompt: false
    modelDisplayLabel: "LiteLLM"

interface:
  privacyPolicy:
    externalUrl: ""
  termsOfService:
    externalUrl: ""

registration:
  socialLogins: []
  allowedDomains: []

fileConfig:
  endpoints:
    openAI:
      fileLimit: 10
      fileSizeLimit: 10485760
      supportedMimeTypes:
        - "text/plain"
        - "text/markdown"
        - "text/csv"
        - "application/pdf"
        - "application/json"

rag:
  enabled: true
  apiUrl: "http://librechat-rag:8000"
  apiKey: "${LITELLM_MASTER_KEY}"
  pdfExtractImages: false

search:
  enabled: true
  provider: "searxng"
  searxng:
    url: "http://searxng:8080"