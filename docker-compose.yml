version: '3.8'

networks:
  ai-stack:
    driver: bridge

services:
  # Local AI Models
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/storage/ollama:/root/.ollama
    networks:
      - ai-stack
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        limits:
          memory: 240G

  # AI Model Router
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config/config.yaml:/app/config.yaml:ro
    networks:
      - ai-stack
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - VENICE_API_KEY=${VENICE_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  # Workflow Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    networks:
      - ai-stack
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=pve-realisethedream.tailb44d6.ts.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=https

  # Open WebUI - Chat Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=True
      - DEFAULT_MODELS=llama-3.3-70b,qwen-2.5-72b
      - ENABLE_SIGNUP=True
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-stack
    depends_on:
      - litellm
      - ollama

  # Hermes Agent - AI Agent Platform
  hermes-agent:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=llama3.3:70b
      - HERMES_API_KEY=${HERMES_API_KEY}
      - OPENAI_API_BASE=http://litellm:4000/v1
    volumes:
      - /mnt/storage/hermes:/opt/data
    networks:
      - ai-stack
    depends_on:
      - ollama
      - litellm
    ports:
      - "8642:8642"
      - "9119:9119"

volumes:
  open-webui-data:
