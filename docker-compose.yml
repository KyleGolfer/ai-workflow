networks:
  ai-stack:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  open-webui-data:
  sandbox-tls:
  caddy-data:

services:
  tailscale-ai:
    image: tailscale/tailscale:stable
    container_name: tailscale-ai
    hostname: ai-workflow
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--reset --accept-routes --advertise-routes=172.21.0.0/16
    volumes:
      - /mnt/appdata/tailscale-ai:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      ai-stack:
        ipv4_address: 172.21.0.10

  # Caddy reverse proxy - shares tailscale network namespace
  caddy:
    image: caddy:2-alpine
    container_name: caddy-ai
    network_mode: service:tailscale-ai  # Shares tailscale-ai's network
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - tailscale-ai

  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    networks:
      ai-stack:
        ipv4_address: 172.21.0.7
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - /mnt/appdata/litellm-db:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      ai-stack:
        ipv4_address: 172.21.0.4
    volumes:
      - /mnt/storage/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_CONTEXT_LENGTH=64000
    deploy:
      resources:
        limits:
          memory: 240G

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    networks:
      ai-stack:
        ipv4_address: 172.21.0.3
    # REMOVED: ports: - "4000:4000"  (Now proxied through Caddy)
    expose:
      - "4000"
    volumes:
      - ./litellm-config/config.yaml:/app/config.yaml:ro
    environment:
      - VENICE_API_KEY=${VENICE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@172.21.0.7:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - litellm-db

  # n8n AI Sandbox Stack (unchanged)
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls
    networks:
      - ai-stack

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    container_name: sandbox-api
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      ai-stack:
        ipv4_address: 172.21.0.11
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:latest
    container_name: sandbox-runner-1
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: http://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      ai-stack:
        ipv4_address: 172.21.0.12

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    expose:
      - "8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      ai-stack:
        ipv4_address: 172.21.0.13

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      ai-stack:
        ipv4_address: 172.21.0.2
    expose:
      - "5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
      - /mnt/appdata/tailscale-ai/certs:/etc/tailscale-certs:ro
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_ENABLED_MODULES=instance-ai
      - N8N_INSTANCE_AI_MODEL_URL=http://172.21.0.3:4000/v1
      - N8N_INSTANCE_AI_MODEL_API_KEY=${LITELLM_MASTER_KEY}
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_IMAGE=ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      - N8N_SANDBOX_SERVICE_URL=http://172.21.0.11:8080
      - N8N_SANDBOX_SERVICE_API_KEY=${SANDBOX_API_KEYS}
      - N8N_INSTANCE_AI_SEARXNG_URL=http://172.21.0.13:8080
    depends_on:
      sandbox-api:
        condition: service_healthy

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    networks:
      ai-stack:
        ipv4_address: 172.21.0.5
    expose:
      - "8080"
    environment:
      - OPENAI_API_BASE_URL=http://172.21.0.3:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_BASE_URL=http://172.21.0.4:11434
      - WEBUI_AUTH=True
      - DEFAULT_MODELS=venice-fast
      - ENABLE_SIGNUP=True
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - litellm
      - ollama