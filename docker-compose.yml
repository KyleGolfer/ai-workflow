networks:
  ai-stack:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale-ai
    hostname: ai-workflow
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--reset --accept-routes --advertise-routes=172.21.0.0/16
    volumes:
      - /mnt/appdata/tailscale-ai:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - ai-stack

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai-stack
    volumes:
      - /mnt/storage/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_CONTEXT_LENGTH=64000
    deploy:
      resources:
        limits:
          memory: 240G

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    networks:
      - ai-stack
    volumes:
      - ./litellm-config/config.yaml:/app/config.yaml:ro
    environment:
      - VENICE_API_KEY=${VENICE_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      - ai-stack
    volumes:
      - ./n8n-data:/home/node/.n8n
      - /mnt/appdata/tailscale-ai/certs:/etc/tailscale-certs:ro
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
  #    - N8N_SSL_KEY=/etc/tailscale-certs/ai-workflow.tailb44d6.ts.net.key
  #    - N8N_SSL_CERT=/etc/tailscale-certs/ai-workflow.tailb44d6.ts.net.crt

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai-stack
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=True
      - DEFAULT_MODELS=venice-fast
      - ENABLE_SIGNUP=True
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - litellm
      - ollama

volumes:
  open-webui-data: