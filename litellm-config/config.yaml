model_list:
  - model_name: local/llama3
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://localhost:11434
      timeout: 120

  - model_name: local/gemma4
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: http://localhost:11434
      timeout: 120

  - model_name: hermes-default
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://localhost:11434
      timeout: 300

  - model_name: venice/premium
    litellm_params:
      model: openai/venice-uncensored
      api_base: https://api.venice.ai/api/v1
      api_key: os.environ/VENICE_API_KEY

  - model_name: venice-fast
    litellm_params:
      model: openai/venice-uncensored-1-2
      api_base: https://api.venice.ai/api/v1
      api_key: os.environ/VENICE_API_KEY

router_settings:
  num_retries: 2
  timeout: 60

litellm_settings:
  drop_params: true

general_settings:
  disable_auth: true
